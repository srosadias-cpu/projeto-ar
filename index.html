<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Árvore em pontos</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #aviso {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #cfd8c8; font-size: 15px; text-align: center; padding: 0 24px;
  }
  #arContainer { position: fixed; inset: 0; display: none; overflow: hidden; z-index: 1; background: #000; touch-action: none; }
  #overlay { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #overlay > * { pointer-events: auto; }
  .btn {
    position: fixed; left: 50%; transform: translateX(-50%);
    padding: 14px 26px; border: 1px solid #cfd8c8; border-radius: 999px;
    background: rgba(0, 0, 0, 0.55); color: #e9efe4; text-decoration: none;
    font-size: 15px; white-space: nowrap; font-family: inherit; cursor: pointer;
  }
  #botao { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  #botaoAR { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  #voltar { top: calc(20px + env(safe-area-inset-top, 0px)); display: none; }
  #dica {
    position: fixed; top: calc(80px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    display: none; padding: 10px 18px; border-radius: 999px; background: rgba(0, 0, 0, 0.6);
    color: #e9efe4; font-size: 14px; text-align: center; max-width: 80%;
  }
  #nota {
    position: fixed; left: 12px; right: 12px; text-align: center; color: #b9c4b3; font-size: 13px; display: none;
    bottom: calc(140px + env(safe-area-inset-bottom, 0px));
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>
<div id="aviso">A carregar…</div>
<div id="arContainer"></div>
<div id="overlay">
  <button id="voltar" class="btn" type="button">Voltar</button>
  <div id="dica">Aponta a câmara para o desenho do jardim</div>
  <div id="nota"></div>
  <button id="botaoAR" class="btn" type="button">Ver no papel</button>
  <a id="botao" class="btn" href="#" target="_blank" rel="noopener"></a>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ====== AJUSTES (podes mudar estes valores) ======
const FICHEIRO = 'arvore1_pontos.bin';
const MARCADOR = 'targets.mind';             // ficheiro criado a partir do teu desenho
const LINK = 'https://www.instagram.com/';   // troca pelo teu link
const TEXTO_BOTAO = 'Ver no Instagram';
const MAX_PONTOS = 120000;                   // menos pontos = mais leve no telemóvel
const TAMANHO_PONTO = 0.012;
const BRILHO = 1.5;                          // sobe se as cores parecerem escuras
const ESCALA_MARCADOR = 0.35;                // tamanho da árvore em relação à largura do desenho
const POSICAO_X = 0;                         // mover a árvore no papel (esquerda -, direita +)
const POSICAO_Y = 0;                         // mover a árvore no papel (baixo -, cima +)

// efeito de dispersão ao tocar
const RAIO_TOQUE = 0.35;                     // tamanho da zona afetada (a árvore tem 2 de altura)
const FORCA_TOQUE = 0.7;                     // até onde os pontos voam
const TEMPO_SAIDA = 0.25;                    // segundos até à dispersão máxima
const TEMPO_REGRESSO = 1.6;                  // quanto demora a voltar ao normal (maior = mais lento)
const TOLERANCIA_TOQUE = 0.12;               // quão perto do toque tem de haver pontos para contar
// =================================================

const botao = document.getElementById('botao');
botao.href = LINK;
botao.textContent = TEXTO_BOTAO;
const aviso = document.getElementById('aviso');
const botaoAR = document.getElementById('botaoAR');
const voltar = document.getElementById('voltar');
const dica = document.getElementById('dica');
const nota = document.getElementById('nota');
const arContainer = document.getElementById('arContainer');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.2, 3.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.update();

const arvore = new THREE.Group();
scene.add(arvore);

// ====== Material dos pontos (com dispersão) ======
const uni = {
  uSize:  { value: TAMANHO_PONTO },
  uPx:    { value: 1 },
  uScale: { value: 400 },
  uHit:   { value: new THREE.Vector3(0, 0, 0) },
  uForca: { value: 0 },
  uRaio:  { value: RAIO_TOQUE },
  uAlcance: { value: FORCA_TOQUE }
};

const materialPontos = new THREE.ShaderMaterial({
  uniforms: uni,
  vertexColors: true,
  transparent: false,
  vertexShader: `
    attribute vec3 aRand;
    uniform float uSize, uPx, uScale, uForca, uRaio, uAlcance;
    uniform vec3 uHit;
    varying vec3 vColor;
    void main() {
      vec3 p = position;
      float d = distance(p, uHit);
      float w = smoothstep(uRaio, 0.0, d);
      vec3 dir = normalize(p - uHit + aRand * 0.35 + vec3(0.0001));
      float forca = w * uForca * uAlcance * (0.5 + 0.9 * abs(aRand.x));
      p += dir * forca + aRand * forca * 0.5;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = uSize * uPx * (uScale / -mv.z) * (1.0 - 0.45 * w * uForca);
      gl_Position = projectionMatrix * mv;
      vColor = color;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      vec2 q = gl_PointCoord - vec2(0.5);
      if (dot(q, q) > 0.25) discard;
      gl_FragColor = vec4(vColor, 1.0);
      #include <colorspace_fragment>
    }
  `
});

let posicoes = null;      // posições locais dos pontos (para saber onde tocaste)
let nPontos = 0;

async function carregar() {
  const resp = await fetch(FICHEIRO);
  if (!resp.ok) throw new Error('ficheiro em falta');
  const buf = await resp.arrayBuffer();
  const dv = new DataView(buf);
  const total = dv.getUint32(0, true);
  const escala = dv.getFloat32(4, true);

  const pos16 = new Int16Array(buf, 8, total * 3);
  const cor8 = new Uint8Array(buf, 8 + total * 6, total * 3);

  const n = Math.min(total, MAX_PONTOS);
  const passo = total / n;
  posicoes = new Float32Array(n * 3);
  const cores = new Float32Array(n * 3);
  const aleat = new Float32Array(n * 3);
  const c = new THREE.Color();

  for (let i = 0; i < n; i++) {
    const j = Math.floor(i * passo);
    posicoes[i * 3]     = pos16[j * 3]     / escala;
    posicoes[i * 3 + 1] = pos16[j * 3 + 1] / escala;
    posicoes[i * 3 + 2] = pos16[j * 3 + 2] / escala;
    c.setRGB(
      Math.min(cor8[j * 3]     / 255 * BRILHO, 1),
      Math.min(cor8[j * 3 + 1] / 255 * BRILHO, 1),
      Math.min(cor8[j * 3 + 2] / 255 * BRILHO, 1),
      THREE.SRGBColorSpace
    );
    cores[i * 3] = c.r; cores[i * 3 + 1] = c.g; cores[i * 3 + 2] = c.b;
    aleat[i * 3]     = Math.random() * 2 - 1;
    aleat[i * 3 + 1] = Math.random() * 2 - 1;
    aleat[i * 3 + 2] = Math.random() * 2 - 1;
  }
  nPontos = n;

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(posicoes, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(cores, 3));
  geo.setAttribute('aRand', new THREE.BufferAttribute(aleat, 3));
  const pontos = new THREE.Points(geo, materialPontos);
  pontos.frustumCulled = false;
  arvore.add(pontos);
  aviso.remove();
}

carregar().catch(() => {
  aviso.textContent = 'Não consegui abrir ' + FICHEIRO + '. Confirma que está na mesma pasta que o index.html.';
});

// ====== Toque: descobrir que ponto da árvore foi tocado ======
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const inv = new THREE.Matrix4();
const o = new THREE.Vector3();
const d = new THREE.Vector3();
let instanteToque = -1000;

function tocar(clientX, clientY, cam, dom) {
  if (!posicoes) return;
  const r = dom.getBoundingClientRect();
  ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, cam);
  arvore.updateMatrixWorld(true);
  inv.copy(arvore.matrixWorld).invert();
  o.copy(raycaster.ray.origin).applyMatrix4(inv);
  d.copy(raycaster.ray.direction).transformDirection(inv);

  const lim2 = TOLERANCIA_TOQUE * TOLERANCIA_TOQUE;
  let melhorT = Infinity, melhor = -1;
  for (let i = 0; i < nPontos; i++) {
    const vx = posicoes[i * 3] - o.x, vy = posicoes[i * 3 + 1] - o.y, vz = posicoes[i * 3 + 2] - o.z;
    const t = vx * d.x + vy * d.y + vz * d.z;
    if (t < 0 || t >= melhorT) continue;
    const perp2 = vx * vx + vy * vy + vz * vz - t * t;
    if (perp2 < lim2) { melhorT = t; melhor = i; }
  }
  if (melhor < 0) return;
  uni.uHit.value.set(posicoes[melhor * 3], posicoes[melhor * 3 + 1], posicoes[melhor * 3 + 2]);
  instanteToque = performance.now() / 1000;
}

function atualizarEfeito(r) {
  const t = performance.now() / 1000 - instanteToque;
  let f = 0;
  if (t >= 0) f = t < TEMPO_SAIDA ? t / TEMPO_SAIDA : Math.exp(-(t - TEMPO_SAIDA) * (3.0 / TEMPO_REGRESSO));
  uni.uForca.value = f < 0.005 ? 0 : f;
  const tam = r.getSize(new THREE.Vector2());
  uni.uScale.value = tam.y * 0.5;
  uni.uPx.value = r.getPixelRatio();
}

// toque simples na vista normal
let inicio = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  inicio = { x: e.clientX, y: e.clientY, t: performance.now() };
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!inicio) return;
  const moveu = Math.hypot(e.clientX - inicio.x, e.clientY - inicio.y);
  const dur = performance.now() - inicio.t;
  inicio = null;
  if (moveu < 10 && dur < 500) tocar(e.clientX, e.clientY, camera, renderer.domElement);
});

// ====== AR com marcador (o desenho no papel) ======
let arAtivo = false;
let arCam = null, arDom = null, arRenderer = null;

async function iniciarAR() {
  if (arAtivo || !nPontos) return;
  arAtivo = true;
  nota.style.display = 'none';
  botaoAR.style.display = 'none';
  try {
    const { MindARThree } = await import('mindar-image-three');

    arContainer.style.display = 'block';
    const mindar = new MindARThree({ container: arContainer, imageTargetSrc: MARCADOR });
    const { renderer: r2, scene: s2, camera: c2 } = mindar;
    const ancora = mindar.addAnchor(0);

    // no marcador, o "cima" do papel é Y e a direção para fora do papel é Z
    scene.remove(arvore);
    arvore.rotation.set(Math.PI / 2, 0, 0);
    arvore.scale.setScalar(ESCALA_MARCADOR);
    arvore.position.set(POSICAO_X, POSICAO_Y, 0);
    uni.uSize.value = TAMANHO_PONTO * ESCALA_MARCADOR;
    ancora.group.add(arvore);

    await mindar.start();

    arCam = c2; arDom = r2.domElement; arRenderer = r2;
    renderer.setAnimationLoop(null);
    renderer.domElement.style.display = 'none';
    r2.setAnimationLoop(() => {
      atualizarEfeito(r2);
      r2.render(s2, c2);
    });

    let ultimo = 0;
    const aoToque = (e) => {
      const agora = performance.now();
      if (agora - ultimo < 60) return;
      ultimo = agora;
      tocar(e.clientX, e.clientY, arCam, arDom);
    };
    arContainer.addEventListener('pointerdown', aoToque);
    arContainer.addEventListener('pointermove', (e) => { if (e.buttons || e.pointerType === 'touch') aoToque(e); });

    voltar.style.display = 'block';
    dica.style.display = 'block';
    ancora.onTargetFound = () => { dica.style.display = 'none'; };
    ancora.onTargetLost = () => { dica.style.display = 'block'; };
  } catch (e) {
    nota.textContent = 'Não consegui abrir a câmara ou o marcador (' + MARCADOR + '). Confirma a permissão da câmara e que o ficheiro existe.';
    nota.style.display = 'block';
    voltar.style.display = 'block';
  }
}

botaoAR.addEventListener('click', iniciarAR);
voltar.addEventListener('click', () => location.reload());

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  atualizarEfeito(renderer);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
